<!DOCTYPE html>
<html lang="{{ boot.lang }}" dir="{{ boot.text_direction }}">
	<head>
		<meta charset="UTF-8" />
		<script>
			/* The document is painted from --surface-base, which only resolves to
			   the dark value once <html data-theme="dark"> exists. src/utils/theme.ts
			   sets that attribute, but it cannot run until the app bundle executes —
			   measured on a production build at 390px with the bundle blocked, the
			   stylesheet alone paints srgb(255,255,255), and the bundle lands about
			   300ms after first paint (1.1s at 6x CPU throttle). So a dark-mode user
			   gets a full-screen white flash on every cold load. Resolving the stored
			   preference here, before the stylesheet can paint, is the only place
			   early enough: the preference lives in localStorage, so the server
			   cannot render it into <html> the way frappe/www/desk.html does.
			   Keep these rules in step with src/utils/theme.ts —
			   src/tests/themeBootstrap.test.ts asserts the two agree. */
			try {
				var preference = localStorage.getItem('themePreference')
				if (
					preference !== 'light' &&
					preference !== 'dark' &&
					preference !== 'system'
				) {
					var legacy = localStorage.getItem('theme')
					preference =
						legacy === 'dark' || legacy === 'light' ? legacy : 'system'
				}
				document.documentElement.setAttribute(
					'data-theme',
					preference === 'system'
						? window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light'
						: preference
				)
			} catch (error) {
				/* Private-mode localStorage throws; the light default still applies. */
			}
		</script>
		<link rel="icon" href="{{ favicon }}" />
		<!-- //// Neoffice — upstream lists here the touch icon of its own brand, and its
		     //// launch images lower (the manifest stays get_pwa_manifest, the tab icon the site's favicon).
		     //// neoffice_theme writes ours: one template for every application put on a phone's home screen
		     //// (neoffice_theme/home_screen.py). « ignore missing »: without the theme, the page opens with no icon.
		     //// At a merge, upstream's block stays out. -->
		{% set neo_home_screen_app = "lms" %}
		{% include "neoffice_theme/templates/includes/home_screen_head.html" ignore missing %}
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
		<!-- Mirrors frappe-ui dark --surface-base, oklch(0.205 0 0) -->
		<meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="msapplication-navbutton-color" content="#ffffff" />
		<!-- //// Neoffice — upstream's launch images removed here: the template above writes ours. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<title>{{ title | e }}</title>
		<meta name="title" content="{{ meta.title | e }}" />
		<meta name="image" content="{{ meta.image | e }}" />
		<meta name="description" content="{{ meta.description | e }}" />
		<meta name="keywords" content="{{ meta.keywords | e }}" />
		<meta property="og:title" content="{{ meta.title | e }}" />
		<meta property="og:image" content="{{ meta.image | e }}" />
		<meta property="og:description" content="{{ meta.description | e }}" />
		<meta name="twitter:title" content="{{ meta.title | e }}" />
		<meta name="twitter:image" content="{{ meta.image | e }}" />
		<meta name="twitter:description" content="{{ meta.description | e }}" />
		<!-- //// Neoffice — the accent of frappe-ui (its blue scale) is repainted with the Neoffice signal by one sheet
		     //// that neoffice_theme serves to every Vue app. It replaces the block each app copied into src/index.css,
		     //// which set RGB triplets where frappe-ui reads colours and so never applied (measured 23.11.2026).
		     //// A script and not a <link>: the build would try to resolve a sheet another app serves. -->
		<script>
			(function () {
				var l = document.createElement("link");
				l.rel = "stylesheet";
				l.href = "/assets/neoffice_theme/css/spa_accent.css";
				document.head.appendChild(l);
			})();
		</script>
	</head>
	<body class="sm:overscroll-y-none">
		<div id="app">
			<div id="seo-content">
				<h1>{{ meta.title | e }}</h1>
				<p>
					{{ meta.description | e }}
				</p>
				<a href="{{ meta.link | e }}">Know More</a>
			</div>
		</div>
		<script>
			document.getElementById('seo-content').style.display = 'none';
		</script>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
