name: build-frontend

on:
  push:
    # version-15 is the branch the fleet deploys from. The two wildcards exist so
    # a branch can be validated on a real instance BEFORE it lands there: the LMS
    # is a commit-the-build SPA, so testing in a browser needs compiled assets,
    # and compiling them by hand on an instance is slow and OOMs on small boxes
    # (2 vCPU + 4 GB is not enough for this bundle). Push to one of these
    # prefixes and the artifacts come back committed, ready to pull and test.
    #   merge-upstream-*  upstream merges, which always need a real-instance pass
    #   build/*           anything else you want built without touching version-15
    branches: [version-15, 'merge-upstream-*', 'build/**']
    paths:
      - 'frontend/**'
      - '!**/node_modules/**'
      - '!lms/public/frontend/**'
      - '!lms/www/lms.html'
      - '!lms/www/_lms.html'

permissions:
  contents: write

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      # //// Neoffice — the SPA depends on `@framework/ui`, linked to ../../frappe/ui from
      # //// frontend/ (upstream 2.62+). The repository therefore has to sit at apps/lms with
      # //// frappe's `ui` directory beside it at apps/frappe/ui, as upstream's own build
      # //// (build-and-commit-assets.yml) lays it out. Upstream takes frappe `develop`; this build
      # //// pins the commit the committed assets were last built and tested with, so a rebuild of
      # //// the same sources gives the same assets. Move the pin only with a build checked on osiris.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}
          path: apps/lms

      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: 969af6156332e21603b8cee79671e38edba232c0
          path: apps/frappe
          sparse-checkout: ui

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: apps/lms/frontend/yarn.lock

      # frontend/src/socket.js statically imports
      # ../../../../sites/common_site_config.json, which from apps/lms/frontend/src is
      # <workspace>/sites/common_site_config.json. Stub it.
      - name: Create common_site_config stub
        run: |
          mkdir -p sites
          echo '{"socketio_port": 9000}' > sites/common_site_config.json

      - name: Install
        working-directory: apps/lms/frontend
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: apps/lms/frontend
        run: yarn build

      - name: Commit artifacts
        working-directory: apps/lms
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lms/public/frontend lms/www/lms.html lms/www/_lms.html
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit --no-verify -m "[skip-build] frontend artifacts for ${GITHUB_SHA::8}"
          git push
