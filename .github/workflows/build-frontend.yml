name: build-frontend

on:
  push:
    branches: [version-15]
    paths:
      - 'frontend/**'
      - '!**/node_modules/**'
      - '!lms/public/frontend/**'
      - '!lms/www/lms.html'
      - '!lms/www/_lms.html'

permissions:
  contents: write

concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # frontend/src/socket.js statically imports
      # ../../../../sites/common_site_config.json. The runner workspace
      # is /home/runner/work/<repo>/<repo>, so the import resolves to
      # /home/runner/work/sites/common_site_config.json. Stub it.
      - name: Create common_site_config stub
        run: |
          mkdir -p ../../sites
          echo '{"socketio_port": 9000}' > ../../sites/common_site_config.json

      - name: Install
        run: cd frontend && yarn install --frozen-lockfile

      - name: Build
        run: cd frontend && yarn build

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lms/public/frontend lms/www/lms.html lms/www/_lms.html
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git commit --no-verify -m "[skip-build] frontend artifacts for ${GITHUB_SHA::8}"
          git push
